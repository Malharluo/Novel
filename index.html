<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>选择你的旅途 | 喏耶格 & 莱古恩柯</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免拖动时选中文字，提升按钮点击体验，不影响实际复制文字 */
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f7f3e9 0%, #e9e0d3 100%);
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            cursor: default;
        }

        /* 装饰性底纹，增加层次感 */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 15% 30%, rgba(210, 180, 140, 0.1) 2%, transparent 2.5%),
                              radial-gradient(circle at 75% 70%, rgba(160, 120, 80, 0.08) 1.8%, transparent 2%);
            background-size: 48px 48px, 60px 60px;
            pointer-events: none;
        }

        /* 主容器：让卡片优雅排列 */
        .choice-container {
            max-width: 1300px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            position: relative;
            z-index: 2;
        }

        /* 卡片样式 — 浮现动画 + 毛玻璃质感 + 高级交互 */
        .card-link {
            text-decoration: none;
            outline: none;
            display: block;
            width: 320px;
            max-width: 85vw;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.3s ease;
            animation: floatUp 0.6s cubic-bezier(0.15, 0.85, 0.35, 1.05) forwards;
            opacity: 0; /* 动画控制初始透明 */
            transform: translateY(30px);
        }

        /* 不同卡片轻微错开浮现，更灵动 */
        .card-link:first-child {
            animation-delay: 0.1s;
        }
        .card-link:last-child {
            animation-delay: 0.25s;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 卡片内核: 优雅玻璃态 + 柔和阴影 */
        .choice-card {
            background: rgba(255, 248, 235, 0.9);
            backdrop-filter: blur(2px);
            border-radius: 2.5rem;
            padding: 2.2rem 1.5rem 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 245, 230, 0.8);
            transition: all 0.25s linear;
            cursor: pointer;
        }

        /* 悬停时增强立体感 + 精致边框光晕 */
        .card-link:hover .choice-card {
            background: rgba(255, 250, 240, 0.98);
            box-shadow: 0 30px 45px -18px rgba(0, 0, 0, 0.35), 0 0 0 2px rgba(210, 160, 110, 0.3);
            transform: scale(1.02);
            backdrop-filter: blur(0px);
        }

        .card-link:active .choice-card {
            transform: scale(0.98);
            transition: transform 0.08s;
        }

        /* 装饰性图标区域 */
        .icon-area {
            font-size: 4rem;
            margin-bottom: 1.2rem;
            display: inline-block;
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.1));
            transition: transform 0.2s ease;
        }

        .card-link:hover .icon-area {
            transform: translateY(-3px);
        }

        /* 主标题文字 */
        .option-name {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #3b2a1f;
            margin-bottom: 0.75rem;
            transition: color 0.2s;
            font-family: 'Segoe UI', 'Noto Sans CJK SC', system-ui;
        }

        .card-link:hover .option-name {
            color: #b45f2b;
            text-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* 辅助说明短句 */
        .helper-text {
            font-size: 0.9rem;
            color: #8b765c;
            border-top: 1px solid #eeddcb;
            display: inline-block;
            padding-top: 0.7rem;
            margin-top: 0.5rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            backdrop-filter: blur(2px);
        }

        /* 差异化点缀：每个卡片的独特色调微差 */
        .card-link:first-child .choice-card {
            background: linear-gradient(135deg, #fff5e8, #fef0e0);
        }
        .card-link:last-child .choice-card {
            background: linear-gradient(135deg, #fffbf0, #f9efdf);
        }

        /* 响应式: 手机适当缩小字体和内边距 */
        @media (max-width: 700px) {
            .choice-container {
                gap: 1.8rem;
            }
            .choice-card {
                padding: 1.5rem 1rem 1.3rem 1rem;
                border-radius: 2rem;
            }
            .option-name {
                font-size: 1.8rem;
            }
            .icon-area {
                font-size: 3.2rem;
            }
            .helper-text {
                font-size: 0.75rem;
            }
        }

        /* 对于更大屏幕，让卡片稍宽一点 */
        @media (min-width: 1100px) {
            .card-link {
                width: 380px;
            }
            .option-name {
                font-size: 2.5rem;
            }
            .icon-area {
                font-size: 4.8rem;
            }
        }

        /* 优雅水印脚注，不干扰视觉 */
        .hint-note {
            position: fixed;
            bottom: 1rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #b6a184;
            background: rgba(245, 235, 220, 0.6);
            backdrop-filter: blur(4px);
            width: fit-content;
            margin: 0 auto;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 0.5px;
            border: 0.5px solid rgba(180, 140, 100, 0.3);
            border-radius: 60px;
        }

        /* 增加轻快动感，点击时可选项说明不会阻挡链接跳转 */
        .card-link:focus-visible {
            outline: 3px solid #cb7b3c;
            outline-offset: 4px;
            border-radius: 2rem;
        }

        /* 提升可访问性 */
        @media (prefers-reduced-motion: reduce) {
            .card-link {
                animation: none;
                opacity: 1;
                transform: none;
            }
            .choice-card,
            .icon-area,
            .card-link:hover .choice-card {
                transition: none;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="choice-container">
        <!-- 选项一：喏耶格 对应根目录下 “喏耶格” 文件夹中的 index.html -->
        <a href="喏耶格/index.html" class="card-link" title="前往喏耶格的世界" target="_self">
            <div class="choice-card">
                <div class="icon-area">🌲✨</div>
                <div class="option-name">喏耶格</div>
                <div class="helper-text">诺言与密林 · 启程</div>
            </div>
        </a>

        <!-- 选项二：莱古恩柯 对应根目录下 “莱古恩柯” 文件夹中的 index.html -->
        <a href="莱古恩柯/index.html" class="card-link" title="探索莱古恩柯的秘境" target="_self">
            <div class="choice-card">
                <div class="icon-area">🌊🔮</div>
                <div class="option-name">莱古恩柯</div>
                <div class="helper-text">潮汐与星轨 · 邂逅</div>
            </div>
        </a>
    </div>

    <!-- 优雅引导提示：告知文件夹结构，提升用户体验（不影响主逻辑） -->
    <div class="hint-note">
        📁 根目录需包含「喏耶格」与「莱古恩柯」文件夹，且各自拥有 index.html
    </div>

    <!-- 添加简单脚本确保点击跳转的稳健性，并补充控制台友好提示（不做额外拦截，完全遵从原生跳转） -->
    <script>
        (function() {
            // 纯粹为了在控制台输出友好提示，以及辅助开发者检查路径约定。
            // 不干预任何默认行为，保证a标签原生的正确跳转。
            console.log(
                "%c✨ 页面已加载 ✨\n点击「喏耶格」将跳转至: ./喏耶格/index.html\n点击「莱古恩柯」将跳转至: ./莱古恩柯/index.html\n请确保对应文件夹与 index 文件存在于根目录下。",
                "color: #b45f2b; font-size: 12px; background: #fef3e4; padding: 4px 8px; border-radius: 8px;"
            );

            // 可选: 针对链接点击做一次优雅的“感知加载”反馈，但绝对不干扰跳转本身。
            // 获取所有卡片链接，增加一个轻提示（仅用于增强触感，非必需）
            const links = document.querySelectorAll('.card-link');
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    // 不阻止默认行为，仅仅让控制台知道正在前往对应页面（调试作用）
                    const folderName = this.querySelector('.option-name')?.innerText || '未知';
                    console.log(`🚪 正在离开，前往「${folderName}」的世界 → ${this.getAttribute('href')}`);
                    // 可选: 添加一个极短暂的样式类，无延迟不影响跳转
                    const card = this.querySelector('.choice-card');
                    if(card) {
                        card.style.transition = 'transform 0.06s linear';
                        card.style.transform = 'scale(0.98)';
                        // 因为跳转很快，这个效果肉眼几乎难察觉，但保证体验不卡顿
                        setTimeout(() => {
                            if(card) card.style.transform = '';
                        }, 60);
                    }
                });
            });

            // 额外辅助：如果在本地打开且无法找到对应路径时，不破坏页面，但通过控制台给个礼貌提示。
            // 注意：由于浏览器无法检测本地文件是否存在（跨安全限制），所以仅做控制台提醒。
            // 用户按照规范搭建文件夹即可完美工作。
        })();
    </script>
</body>
</html>
